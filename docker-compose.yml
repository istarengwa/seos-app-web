# Coolify: base directory /, Compose /docker-compose.yml, domain on web:80.
x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  environment: &environment
    RAILS_ENV: production
    SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
    RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:-}
    ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:?Set encryption primary key}
    ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:?Set encryption deterministic key}
    ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:?Set encryption salt}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER:-seos}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB:-seos_production}
    RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-5}
    RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL:-info}
    SKIP_DATABASE_PREPARE: "1"
    SEOS_PUBLIC_HOST: ${SEOS_PUBLIC_HOST:?Set public hostname without https://}
    SEOS_ASSUME_SSL: ${SEOS_ASSUME_SSL:-true}
    SEOS_MAIL_FROM: ${SEOS_MAIL_FROM:?Set SEOS_MAIL_FROM}
    SEOS_MAIL_DELIVERY: ${SEOS_MAIL_DELIVERY:-gmail}
    GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID:?Set GMAIL_CLIENT_ID}
    GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET:?Set GMAIL_CLIENT_SECRET}
    GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN:?Set GMAIL_REFRESH_TOKEN}
    SEOS_MAIL_DOMAIN: ${SEOS_PUBLIC_HOST}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    MAP_TILE_URL: ${MAP_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
  volumes:
    - app_storage:/rails/storage

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-seos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-seos_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    <<: *app
    command: [./bin/rails, db:prepare]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *app
    command: [./bin/thrust, ./bin/rails, server]
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://127.0.0.1/up]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  jobs:
    <<: *app
    command: [./bin/jobs]
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      <<: *environment
      JOB_CONCURRENCY: ${JOB_CONCURRENCY:-1}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, ./bin/rails, runner, 'exit(SolidQueue::Process.where(hostname: Socket.gethostname).where("kind LIKE ?", "Supervisor%").where("last_heartbeat_at > ?", 2.minutes.ago).exists? ? 0 : 1)']
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s

volumes:
  postgres_data:
  app_storage:
