default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

test:
  <<: *default
  database: storage/test.sqlite3

# One PostgreSQL server, four databases. No production SQLite files.
production:
  primary: &production
    adapter: postgresql
    encoding: unicode
    host: <%= ENV.fetch("POSTGRES_HOST", "postgres") %>
    port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
    username: <%= ENV.fetch("POSTGRES_USER", "seos") %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    max_connections: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
    database: <%= ENV.fetch("POSTGRES_DB", "seos_production") %>
    schema_format: ruby
    schema_dump: schema.rb
    seeds: true
  cache:
    <<: *production
    database: <%= ENV.fetch("POSTGRES_DB", "seos_production") %>_cache
    schema_format: ruby
    schema_dump: cache_schema.rb
    seeds: false
    migrations_paths: db/cache_migrate
  queue:
    <<: *production
    database: <%= ENV.fetch("POSTGRES_DB", "seos_production") %>_queue
    schema_format: ruby
    schema_dump: queue_schema.rb
    seeds: false
    migrations_paths: db/queue_migrate
  cable:
    <<: *production
    database: <%= ENV.fetch("POSTGRES_DB", "seos_production") %>_cable
    schema_format: ruby
    schema_dump: cable_schema.rb
    seeds: false
    migrations_paths: db/cable_migrate
